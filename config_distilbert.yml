# =============================================================================
# OPTIONAL DistilBERT pipeline. Use only if inference latency stays well under
# 3 seconds in your deployment environment. In Rasa 3.x the old
# HFTransformersNLP component was replaced by LanguageModelFeaturizer.
# Train with:  rasa train nlu --config config_distilbert.yml
# =============================================================================
recipe: default.v1
language: en
assistant_id: eco-travel-advisor-distilbert
pipeline:
  - name: WhitespaceTokenizer
  - name: LanguageModelFeaturizer
    model_name: distilbert
    model_weights: distilbert-base-uncased
  - name: RegexFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: DIETClassifier
    epochs: 60
    constrain_similarities: true
  - name: EntitySynonymMapper
  - name: FallbackClassifier
    threshold: 0.6
    ambiguity_threshold: 0.1
policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_default_fallback
  - name: TEDPolicy
    max_history: 5
    epochs: 60
